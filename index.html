<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kompas Karya — Misi Perjalanan Proyek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9; --card: #fff; --ink: #0f1c2f; --mut: #58667a;
  --pri: #1b4b91; --brand: #1b4b91; --acc: #c8a24a; --line: #e0e5ed;
  --land: #d3dcea; --ls: #9fb0c9; --nav: #0a1730;
  --sh: 0 1px 2px rgba(10,23,48,.05), 0 6px 20px rgba(10,23,48,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1220; --card: #101b2d; --ink: #e6ecf5; --mut: #95a4b8;
    --brand: #4a82e8; --line: #21304a; --land: #1c2c45; --ls: #3b5075; --sh: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1220; --card: #101b2d; --ink: #e6ecf5; --mut: #95a4b8;
  --brand: #4a82e8; --line: #21304a; --land: #1c2c45; --ls: #3b5075; --sh: none;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 70px; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font: 15px/1.65 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin: .2em 0; }
h1 { font-size: clamp(26px, 4vw, 34px); }
h2 { font-size: 20px; margin: 1.6em 0 .6em; }
h3 { font-size: 16px; }
h4 { font-size: 14px; margin: .9em 0 .3em; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; background: var(--nav); color: #c3cfe2;
  display: flex; flex-direction: column; padding: 26px 14px 18px; gap: 8px; overflow-y: auto;
}
.brand { padding: 0 12px 20px; border-bottom: 1px solid rgba(255,255,255,.09); }
.brand b { display: block; color: #fff; font-size: 18px; font-weight: 800; letter-spacing: .01em; }
.brand small { font-size: 12.5px; color: #8396b3; }
#nav { display: flex; flex-direction: column; gap: 2px; }
.ng { font-size: 12px; font-weight: 600; color: #7487a6; margin: 18px 12px 6px; }
#nav button {
  display: block; border: 0; background: none; color: #c3cfe2; font: inherit;
  font-size: 14.5px; font-weight: 600; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left;
}
#nav button:hover { background: rgba(255,255,255,.06); }
#nav button.on { background: rgba(255,255,255,.09); color: #fff; box-shadow: inset 2px 0 0 var(--acc); }
.sf { margin-top: auto; }
.scrim { display: none; }
#pl { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
#pl .pt { font-size: 12px; font-weight: 600; color: #8396b3; }
#pl select { background: var(--nav); color: #e6ecf5; border-color: #2a3d5c; font-size: 13px; padding: 7px 8px; border-radius: 6px; }
#pl .btn { background: var(--acc); color: var(--nav); justify-content: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 12px 32px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.ttl { flex: 1; font-size: 13px; color: var(--mut); }
.ttl b { color: var(--ink); }
.chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.mb { display: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; }

main { flex: 1; padding: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 32px 40px; }
footer { color: var(--mut); font-size: 12.5px; padding: 18px 32px; text-align: center; border-top: 1px solid var(--line); background: var(--card); }

.eye { color: var(--brand); font-weight: 700; font-size: 13px; }

.hero2 .wrap { padding-top: 0; padding-bottom: 0; }
.hero2 h1 { color: #fff; font-size: clamp(30px, 4.6vw, 46px); margin: .15em 0; }
.hero2 p { color: #b4c2d9; max-width: 52ch; margin: .6em 0 0; font-size: 16px; }
.hero2 .eye { color: var(--acc); }

.pull { margin-top: -52px; position: relative; z-index: 2; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: var(--sh); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid > .card { margin: 0; }
.g2 { grid-template-columns: 1fr 1fr; }

.login h2 { margin: 0 0 4px; }
.login p { margin: 0 0 14px; }
.lg { display: flex; gap: 12px; flex-wrap: wrap; }
.lg select { flex: 1; min-width: 220px; width: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px;
  padding: 10px 20px; background: var(--brand); color: #fff; font: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; text-decoration: none; transition: filter .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn.o { background: none; color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
.btn.s { padding: 6px 12px; font-size: 13px; }
.btn.d { background: var(--nav); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }

.tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 99px; color: #fff; font-weight: 600; vertical-align: middle; }

select, textarea, input {
  width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { min-height: 84px; }
select:focus, textarea:focus, input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }

.pb { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; }
.pb i { display: block; height: 100%; background: var(--pri); border-radius: 9px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mut { color: var(--mut); }

.step { display: flex; gap: 14px; align-items: flex-start; }
.sn { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--nav); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.step b { display: block; }

.ban { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 12px; padding: 18px 20px; box-shadow: var(--sh); }
.ban b { font-size: 18px; }
.bs { color: var(--mut); font-size: 13.5px; }

.mapz { margin: 36px auto 0; max-width: 880px; }
.mapz p { margin: 0 0 6px; font-size: 13.5px; }
.mimg { display: none; width: 100%; height: auto; }
#mp { display: block; width: 100%; height: auto; max-height: 480px; }
.land { fill: var(--land); stroke: var(--ls); stroke-width: 1; stroke-linejoin: round; }
.pin { cursor: pointer; }

table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
th { font-size: 12.5px; color: var(--mut); font-weight: 700; }
td:first-child, th:first-child { text-align: left; }
.tw { overflow-x: auto; }
td.c button { width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent; color: #fff; font-weight: 700; cursor: pointer; }
td.c button.sel { border-color: var(--ink); }
td.c small { display: block; font-size: 11px; color: var(--mut); }

.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
.stat .card { margin: 0; }
.stat b { font-size: 28px; font-weight: 800; color: var(--brand); display: block; line-height: 1.2; }

.chk { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chk input { width: 20px; height: 20px; flex: none; accent-color: var(--brand); }

.em { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 12px 0; }
.em button { font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 12px 6px; cursor: pointer; }
.em button:hover { border-color: var(--brand); background: var(--bg); }

.g4 { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.slot { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); position: relative; overflow: hidden; padding: 0; cursor: pointer; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 3px; text-align: center; }

#tt { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--nav); color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 60; display: none; max-width: 90vw; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
#md { position: fixed; inset: 0; background: rgba(5,10,18,.6); display: none; place-items: center; z-index: 50; padding: 16px; }
#md.on { display: grid; }
#md .card { width: min(440px, 100%); max-height: 90vh; overflow: auto; margin: 0; }
#md img, #gp img { width: 100%; border-radius: 10px; margin: 8px 0; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 14px; }
.tb { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 96px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 10px; cursor: pointer; font: inherit; }
.tb b { font-size: 15px; }
.tb small { font-size: 11px; max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb i { font-style: normal; font-size: 11px; color: var(--mut); }
.tb.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.tb.on i { color: #fff; }

.sb { border-radius: 12px; color: #fff; padding: 22px 24px; margin-bottom: 14px; background: var(--nav); border-left: 6px solid var(--a); }
.sb:before, .rl { display: none; }
.sbt small { opacity: .8; font-weight: 600; }
.sbt h2 { font-size: clamp(22px, 4vw, 30px); margin: 2px 0; }
.sbt div { color: #c3cfe2; }

.win { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: var(--sh); }
.win .wc { padding: 20px; }
.wb { background: #16243c; color: #c3cfe2; padding: 9px 16px; font: 12px ui-monospace, monospace; }

.note { font-size: 13.5px; padding: 9px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--acc); margin: 8px 0; }
.note.lock { border-left-color: #b3261e; }
.dim { opacity: .5; }
details.card summary { cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .side { transition: none !important; } }
@media (max-width: 900px) {
  .app { display: block; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; z-index: 40; transform: translateX(-100%); transition: transform .25s; }
  body.dro .side { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(5,10,18,.55); z-index: 30; display: none; }
  body.dro .scrim { display: block; }
  .mb { display: inline-block; }
  .top { padding-left: 16px; padding-right: 16px; }
  .wrap { padding: 22px 16px 32px; }
  .hero2 .wrap { padding: 0 16px; }
  .hero2 { padding: 36px 0 64px; }
  .pull { margin-top: -40px; }
  footer { padding: 16px; }
  .chips .chip:nth-child(2) { display: none; }
}
@media (max-width: 560px) {
  .g2 { grid-template-columns: 1fr; }
  .stat b { font-size: 22px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="sd">

    <div class="sf"><div id="pl"></div></div>

  <div class="scrim" onclick="dr(false)"></div>
  <div class="main">
    <header class="top">
      <button class="mb" id="mbtn" onclick="dr()" aria-label="Buka menu"></button>
      <div class="ttl">Kompas Karya / <b id="crumb"></b></div>

    <main id="app"></main>
    <footer>Kompas Karya · Panduan Misi Perjalanan Proyek · Merchandise Pariwisata Budaya Jawa Timur</footer>
  </div>
</div>
<div id="tt"></div>
<div id="md"></div>

<script type="module">
  // Import SDK Firebase dari CDN resmi secara utuh
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Konfigurasi Firebase Kompas Karya
  const firebaseConfig = {
    apiKey: "AIzaSyCvhlA_iEQGIErVMSRAxpVN_AhbKPrMRDU",
    authDomain: "kompas-karya.firebaseapp.com",
    projectId: "kompas-karya",
    storageBucket: "kompas-karya.firebasestorage.app",
    messagingSenderId: "568270726986",
    appId: "1:568270726986:web:a9c8a54b47141ed7e1c3b3"
  };

  // Inisialisasi Firebase & Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  console.log("Firebase berhasil terhubung ke proyek Kompas Karya!");

  // 1. Fungsi Simpan Misi Kita
  window.simpanMisiData = async function(namaKelompok, daerahRiset, progresData) {
    try {
      await addDoc(collection(db, "misi_kita"), {
        kelompok: namaKelompok,
        daerah: daerahRiset,
        progres: progresData,
        waktuKirim: serverTimestamp()
      });
      alert("Misi kelompok berhasil dikirim dan tersimpan online!");
    } catch (error) {
      console.error("Gagal menyimpan misi: ", error);
      alert("Terjadi kesalahan saat menyimpan data misi.");
    }
  };

  // 2. Fungsi Simpan Refleksi Siswa
  window.simpanRefleksiData = async function(namaSiswa, kelompokSiswa, isiRefleksi) {
    try {
      await addDoc(collection(db, "refleksi_siswa"), {
        nama: namaSiswa,
        kelompok: kelompokSiswa,
        refleksi: isiRefleksi,
        waktuKirim: serverTimestamp()
      });
      alert("Refleksi berhasil dikirim dan tersimpan online!");
    } catch (error) {
      console.error("Gagal menyimpan refleksi: ", error);
      alert("Terjadi kesalahan saat mengirim refleksi.");
    }
  };

  // 3. Fungsi Simpan Galeri Pameran
  window.simpanGaleriData = async function(namaKelompok, judulKarya, deskripsiKarya, linkGambar) {
    try {
      await addDoc(collection(db, "galeri_pameran"), {
        kelompok: namaKelompok,
        judul: judulKarya,
        deskripsi: deskripsiKarya,
        gambar: linkGambar,
        waktuKirim: serverTimestamp()
      });
      alert("Karya pameran berhasil dikirim dan tersimpan online!");
    } catch (error) {
      console.error("Gagal menyimpan galeri: ", error);
      alert("Terjadi kesalahan saat mengirim karya pameran.");
    }
  };

  // Penghubung Otomatis Form (Misi, Refleksi, dan Galeri)
  const formMisi = document.getElementById("form-misi");
  if (formMisi) {
    formMisi.addEventListener("submit", function(e) {
      e.preventDefault();
      window.simpanMisiData(
        document.getElementById("kelompok").value,
        document.getElementById("daerah").value,
        document.getElementById("progres").value
      );
      formMisi.reset();
    });
  }

  const formRefleksi = document.getElementById("form-refleksi");
  if (formRefleksi) {
    formRefleksi.addEventListener("submit", function(e) {
      e.preventDefault();
      window.simpanRefleksiData(
        document.getElementById("namaSiswa").value,
        document.getElementById("kelompokSiswa").value,
        document.getElementById("isiRefleksi").value
      );
      formRefleksi.reset();
    });
  }

  const formGaleri = document.getElementById("form-galeri");
  if (formGaleri) {
    formGaleri.addEventListener("submit", function(e) {
      e.preventDefault();
      window.simpanGaleriData(
        document.getElementById("galeriKelompok").value,
        document.getElementById("galeriJudul").value,
        document.getElementById("galeriDeskripsi").value,
        document.getElementById("galeriGambar").value
      );
      formGaleri.reset();
    });
  }
</script>
